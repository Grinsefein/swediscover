name: swediscover_bff
description: Backend-for-Frontend (BFF) für SweDiscover – kapselt Trafiklab-/Trafikverket-Zugriffe und streamt kompakte JSON an die Flutter-App.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  fixnum: ^1.1.1
  http: ^1.6.0
  protobuf: ^6.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0